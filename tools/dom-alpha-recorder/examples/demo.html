<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>DOM Alpha Recorder demo</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #c8d1df; }
  #animation { width: 360px; height: 240px; position: relative; }
  .orb { position: absolute; width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(140deg, #9fe4a6, #9587eb); box-shadow: 0 8px 18px #9587eb66; top: 50px; left: 20px; animation: drift 2s ease-in-out infinite alternate; }
  .js-dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #ff9c88; top: 175px; }
  @keyframes drift { to { transform: translateX(220px) rotate(180deg); } }
</style>
<div id="animation"><div class="orb"></div><div class="js-dot"></div></div>
<script>
  const dot = document.querySelector('.js-dot');
  function frame(now) { dot.style.left = `${170 + Math.sin(now / 400) * 140}px`; requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
</script>
</html>
