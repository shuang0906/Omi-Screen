<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Indicator</title>
<link rel="stylesheet" href="./assets/css/indicator.css">
</head>

<body>
<!-- Slide Indicator: bottom indicator from Figma "MegaETH (Internal)" node 3582:30179.
     The active item is a pill whose white bar shows autoplay progress. Behaviour in assets/js/indicator.js. -->
<main class="layout">
  <nav class="indicator" data-indicator data-count="4" data-duration="3000" aria-label="Slides"></nav>
</main>
<div class="sr-only" aria-live="polite" data-announcement></div>

<script src="./assets/js/indicator.js"></script>
</body>

</html>
